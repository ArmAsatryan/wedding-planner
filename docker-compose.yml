services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding123
      POSTGRES_DB: wedding_planner
    ports:
      - "5433:5432"
    volumes:
      - wedding_planner_data:/var/lib/postgresql/data

volumes:
  wedding_planner_data:
